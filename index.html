<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d5b">
  <title>살림재고</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><h1 id="title">재고</h1></header>

  <main id="main"></main>

  <button class="fab" data-action="new-item" aria-label="품목 추가">+</button>

  <nav class="tabbar">
    <button data-tab="stock" class="active"><span class="ico">📦</span>재고</button>
    <button data-tab="shop"><span class="ico">🛒</span>장보기<b class="badge" id="shop-badge" hidden></b></button>
    <button data-tab="settings"><span class="ico">⚙️</span>설정</button>
  </nav>

  <dialog id="sheet"><div id="sheet-body"></div></dialog>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
